<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Instagram Following - Risultati</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 16px;
  }
  h1 {
    margin-top: 0;
  }
  .summary, .counts, .actions {
    margin-bottom: 16px;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
  }
  #bulk-status {
    font-size: 13px;
    line-height: 1.4;
  }
  #nonback-list {
    max-height: 60vh;
    overflow: auto;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
  }
  #nonback-list li {
    margin: 4px 0;
    font-size: 14px;
  }
  #nonback-list a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }
  #nonback-list a:hover {
    text-decoration: underline;
  }
  .meta {
    margin-left: 6px;
    font-size: 12px;
    color: #6b7280;
  }
  .tag {
    font-size: 11px;
    background: #eee;
    border-radius: 4px;
    padding: 2px 4px;
    margin-left: 6px;
  }
  details {
    margin-top: 16px;
  }
  pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>Following Instagram</h1>

  <div class="summary">
    <div><strong>Username:</strong> <span id="username"></span></div>
    <div><strong>User ID:</strong> <span id="userId"></span></div>
  </div>

  <div class="counts">
    <div><strong>Totale following:</strong> <span id="following-total"></span> (pagine: <span id="following-pages"></span>)</div>
    <div><strong>Totale followers:</strong> <span id="followers-total"></span> (pagine: <span id="followers-pages"></span>)</div>
    <div><strong>Utenti che non mi seguono:</strong> <span id="nonback-total"></span></div>
  </div>

  <div class="actions">
    <div id="bulk-actions"></div>
    <div id="bulk-status"></div>
  </div>

  <h2>Utenti che IO seguo ma che NON mi seguono (ordinati dal follow più recente)</h2>
  <ul id="nonback-list"></ul>

  <details>
    <summary>Mostra JSON grezzo</summary>
    <pre id="raw-json"></pre>
  </details>

  <script src="results.js"></script>
</body>
</html>
